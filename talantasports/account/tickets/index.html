<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Tickets · Talanta Sports City</title>
  <style>
    :root { --paper: #f7f5f1; --ink: #17141a; --muted: #6e6a70; --card: #fff; --line: #e5e1db; --green: #07833f; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: Arial, Helvetica, sans-serif; }
    body.dark-mode { --paper: #151219; --ink: #f5f1ea; --muted: #c5bec5; --card: #211d26; --line: #49414e; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 16px 6vw; color: #fff; background: #0e0c10; }
    .brand { color: #fff; font-size: clamp(20px, 3vw, 31px); font-weight: 900; text-decoration: none; text-transform: uppercase; }
    .top-actions { display: flex; align-items: center; gap: 12px; }
    .theme-toggle { border: 1px solid #77717a; border-radius: 999px; padding: 7px 12px; color: #fff; background: transparent; font-size: 12px; font-weight: 700; cursor: pointer; }
    .home-link { color: #bce7cc; font-size: 13px; font-weight: 700; text-decoration: none; }
    main { max-width: 820px; min-height: calc(100vh - 144px); margin: 0 auto; padding: 54px 24px 80px; }
    .eyebrow { margin: 0 0 10px; color: var(--green); font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; font-size: clamp(40px, 8vw, 72px); font-weight: 400; line-height: .95; text-transform: uppercase; }
    .welcome { margin: 18px 0 30px; color: var(--muted); }
    .ticket { border: 1px solid var(--line); border-left: 5px solid var(--green); padding: 24px; background: var(--card); }
    .ticket h2 { margin: 0 0 10px; font-size: 22px; }
    .ticket p { margin: 7px 0; color: var(--muted); font-size: 14px; }
    .ticket strong { color: var(--ink); }
    .button { display: inline-flex; margin-top: 18px; padding: 12px 18px; color: #fff; background: var(--green); font-size: 13px; font-weight: 700; text-decoration: none; }
    .button:hover { background: #066d35; }
    .signed-out { display: none; }
    footer { padding: 25px; color: #d8d1c8; background: #0e0c10; text-align: center; font-size: 12px; }
    footer a { color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../../">Talanta Sports City</a>
    <div class="top-actions">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode">☾ Dark mode</button>
      <a class="home-link" href="../../">Home</a>
    </div>
  </header>
  <main>
    <p class="eyebrow">Your account</p>
    <h1>My tickets</h1>
    <p class="welcome" id="welcome">Your tickets will appear here.</p>
    <section class="ticket" id="ticket">
      <h2>Bayern Munich vs Ajax</h2>
      <p><strong>Tuesday, 5 January 2027 · 11:00</strong></p>
      <p>Raila Odinga International Stadium, Nairobi</p>
      <a class="button" href="../../events/fc-bayern-munchen-vs-afc-ajax/seats/">View seat map</a>
    </section>
    <section class="signed-out" id="signed-out">
      <p>You are not signed in yet.</p>
      <a class="button" href="../../login/">Log in</a>
    </section>
  </main>
  <footer><a href="../../">Talanta Sports City</a> · Ngong Rd, Nairobi</footer>
  <script>
    var themeToggle = document.getElementById('theme-toggle');
    function applyTheme(theme) {
      var dark = theme === 'dark';
      document.body.classList.toggle('dark-mode', dark);
      themeToggle.textContent = dark ? '☀ Light mode' : '☾ Dark mode';
      themeToggle.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
      try { localStorage.setItem('webticket-theme', dark ? 'dark' : 'light'); } catch (ignore) {}
    }
    var savedTheme = 'light';
    try { savedTheme = localStorage.getItem('webticket-theme') || 'light'; } catch (ignore) {}
    applyTheme(savedTheme);
    themeToggle.addEventListener('click', function () { applyTheme(document.body.classList.contains('dark-mode') ? 'light' : 'dark'); });
    try {
      var auth = JSON.parse(localStorage.getItem('webticket-auth') || 'null');
      if (auth && auth.signedIn && auth.identity) document.getElementById('welcome').textContent = 'Signed in as ' + auth.identity + '. Your tickets are listed below.';
      else { document.getElementById('ticket').style.display = 'none'; document.getElementById('signed-out').style.display = 'block'; }
    } catch (ignore) {}
  </script>
</body>
</html>
