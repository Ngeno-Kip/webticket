<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resale tickets · Bayern Munich vs Ajax</title>
  <link rel="stylesheet" href="../../resale.css">
</head>
<body>
  <script src="../../resale-app.js"></script><script>WT.boot();</script>
  <div id="shell"></div>
  <main class="page" id="main"></main>
  <footer><a href="../../">Talanta Sports City</a> · Resale listings are verified against the original ticket.</footer>
  <script>
    (function () {
      var main = document.getElementById('main'), selected = null, lockTimer = null;
      function render() {
        var requestedListing = new URLSearchParams(window.location.search).get('listing'), listings = WT.getListings().filter(function (listing) { return listing.status === 'active' && (listing.visibility === 'public' || listing.id === requestedListing) && listing.expiry > WT.now(); }), tickets = WT.getTickets();
        document.getElementById('shell').innerHTML = WT.nav('../../', 'marketplace', false);
        if (!WT.settings().resaleEnabled) { main.innerHTML = '<p class="eyebrow">Marketplace</p><h1>Resale paused</h1><div class="notice warn">Resale listings are temporarily disabled by an administrator. Please check back later.</div>'; return; }
        main.innerHTML = '<p class="eyebrow">Verified resale · ' + WT.esc(WT.EVENT.venue) + '</p><h1>Find your seat</h1><p class="lede">Official tickets resold by approved holders. Choose a resale pin or listing below; the same stadium seat-map layout helps you shop by section.</p><div class="market-grid"><section><div class="seat-map"><img src="../../brand/stadium/stadium-seating-map-transparent.png" alt="Stadium seat map"><button class="seat-pin pin-a" data-section="401">401 · resale</button><button class="seat-pin pin-b" data-section="415">415 · resale</button><button class="seat-pin pin-c" data-section="418">418 · transfer</button><button class="seat-pin pin-d" data-section="420">420 · sold</button></div><div class="notice" style="margin-top:14px"><strong>Resale badge:</strong> every card below is linked to a live ticket record. Price includes the reseller asking price; face value remains visible before checkout.</div><div class="grid" id="listing-grid" style="margin-top:18px">' + (listings.length ? listings.map(function (listing) { var ticket = tickets.filter(function (item) { return item.key === listing.ticketKey; })[0]; return ticket ? listingCard(listing, ticket) : ''; }).join('') : '<div class="card empty">No public resale listings are available for this event.</div>') + '</div></section><aside class="card lock-panel" id="checkout"><div class="card-header"><div><h2>Checkout</h2><p>Select a listing to reserve it for 10 minutes.</p></div><span class="badge" id="checkout-badge">10 min lock</span></div><div id="checkout-body"><div class="empty">Your selected seat and payment details will appear here.</div></div></aside></div>';
        bindListings(); if (selected) selectListing(selected.id); else bindSeatPins();
      }
      function listingCard(listing, ticket) { return '<article class="card listing-card" data-listing="' + WT.esc(listing.id) + '" data-section="' + WT.esc(ticket.section) + '"><div class="listing-top"><div><span class="badge listed">' + (listing.visibility === 'private' ? 'Private resale' : 'Resale') + '</span><h2 style="margin:9px 0 0">Section ' + WT.esc(ticket.section) + '</h2></div><div class="price">' + WT.money(listing.price) + '<small>per ticket</small></div></div><p>' + WT.esc(WT.EVENT.date) + ' · ' + WT.esc(ticket.gate) + '<br>Row ' + WT.esc(ticket.row) + ' · Seat ' + WT.esc(ticket.seat) + '<br><span class="muted">Face value ' + WT.money(ticket.faceValue) + '</span></p><button class="button choose-listing" data-id="' + WT.esc(listing.id) + '">Buy this ticket</button></article>'; }
      function bindListings() { document.querySelectorAll('.choose-listing').forEach(function (button) { button.addEventListener('click', function () { var listing = WT.getListings().filter(function (item) { return item.id === button.dataset.id; })[0]; if (listing) selectListing(listing.id); }); }); bindSeatPins(); }
      function bindSeatPins() { document.querySelectorAll('.seat-pin').forEach(function (pin) { pin.addEventListener('click', function () { var card = document.querySelector('.listing-card[data-section="' + pin.dataset.section + '"]'); if (card) { card.scrollIntoView({ behavior: 'smooth', block: 'center' }); card.classList.add('selected'); window.setTimeout(function () { card.classList.remove('selected'); }, 1600); var button = card.querySelector('.choose-listing'); button.click(); } else WT.toast('No live public listing in section ' + pin.dataset.section + '.'); }); }); }
      function selectListing(id) {
        selected = WT.getListings().filter(function (listing) { return listing.id === id && listing.status === 'active' && listing.expiry > WT.now(); })[0]; if (!selected) { WT.toast('That listing is no longer available.', 'error'); render(); return; }
        var ticket = WT.getTicket(selected.ticketKey); document.querySelectorAll('.listing-card').forEach(function (card) { card.classList.toggle('selected', card.dataset.listing === id); });
        var lockRows = WT.read(WT.KEYS.locks, {}), lock = lockRows[id]; if (!lock || lock.expiresAt <= WT.now()) { lock = { id: WT.uid('LOCK'), listingId: id, expiresAt: WT.now() + 10 * 60000 }; lockRows[id] = lock; WT.write(WT.KEYS.locks, lockRows); WT.audit('checkout.lock.created', id + ' locked for 10 minutes'); }
        document.getElementById('checkout-body').innerHTML = '<div class="ticket-pass"><span class="badge listed">Resale</span><div class="pass-event" style="margin-top:9px">Section ' + WT.esc(ticket.section) + ' · Row ' + WT.esc(ticket.row) + ' · Seat ' + WT.esc(ticket.seat) + '</div><p class="muted">' + WT.esc(WT.EVENT.name) + ' · ' + WT.esc(WT.EVENT.date) + '</p><p>Face value ' + WT.money(ticket.faceValue) + ' · <strong>' + WT.money(selected.price) + ' asking price</strong></p></div><p class="help">Reservation expires in <span class="timer" id="lock-countdown"></span>. The ticket is released automatically if payment is not completed.</p><form id="pay-form"><div class="form-grid"><div class="field full"><label for="buyer-name">Buyer name</label><input id="buyer-name" required placeholder="Your full name"></div><div class="field"><label for="buyer-phone">Phone</label><input id="buyer-phone" required placeholder="+254712345678"></div><div class="field"><label for="buyer-email">Email</label><input id="buyer-email" type="email" required placeholder="you@example.com"></div><div class="field full"><label for="payment-method">Payment method</label><select id="payment-method"><option>M-Pesa STK Push</option><option>Card</option></select></div></div><div class="action-row"><button class="button" type="submit">Pay ' + WT.money(selected.price) + '</button></div></form>';
        document.getElementById('pay-form').addEventListener('submit', completePurchase); updateCountdown(lock.expiresAt);
      }
      function updateCountdown(expiresAt) { window.clearInterval(lockTimer); function tick() { var remaining = Math.max(0, expiresAt - WT.now()), seconds = Math.floor(remaining / 1000), label = Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0'), target = document.getElementById('lock-countdown'); if (target) target.textContent = label; if (!remaining) { window.clearInterval(lockTimer); var locks = WT.read(WT.KEYS.locks, {}); delete locks[selected.id]; WT.write(WT.KEYS.locks, locks); WT.audit('checkout.lock.released', selected.id + ' released after timeout'); WT.toast('The 10-minute reservation expired.'); render(); } } tick(); lockTimer = window.setInterval(tick, 1000); }
      function completePurchase(event) { event.preventDefault(); if (!selected) return; var locks = WT.read(WT.KEYS.locks, {}), lock = locks[selected.id]; if (!lock || lock.expiresAt <= WT.now()) { WT.toast('Your reservation expired. Please select the listing again.', 'error'); render(); return; } var rows = WT.getListings(), listing = rows.filter(function (item) { return item.id === selected.id; })[0], ticketRows = WT.getTickets(), ticket = ticketRows.filter(function (item) { return item.key === selected.ticketKey; })[0]; if (!listing || !ticket || listing.status !== 'active') { WT.toast('This ticket was just purchased by another buyer.', 'error'); render(); return; } listing.status = 'sold'; listing.soldAt = WT.now(); ticket.status = 'held'; ticket.owner = document.getElementById('buyer-email').value.trim(); ticket.holderName = document.getElementById('buyer-name').value.trim(); delete locks[selected.id]; WT.write(WT.KEYS.listings, rows); WT.write(WT.KEYS.tickets, ticketRows); WT.write(WT.KEYS.locks, locks); WT.audit('resale.purchase.completed', selected.id + ' paid via ' + document.getElementById('payment-method').value + '; ownership moved to buyer'); WT.toast('Payment successful. Ticket ownership moved to ' + ticket.holderName + '.'); selected = null; window.clearInterval(lockTimer); render(); }
      WT.boot(); render();
    }());
  </script>
</body>
</html>
