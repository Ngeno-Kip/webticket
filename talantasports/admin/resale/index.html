<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resale & transfer settings · Talanta Sports City</title>
  <link rel="stylesheet" href="../../resale.css">
</head>
<body>
  <script src="../../resale-app.js"></script><script>WT.boot();</script>
  <div id="shell"></div>
  <main class="page" id="main"></main>
  <footer><a href="../../">Talanta Sports City</a> · Administrator controls</footer>
  <script>
    (function () {
      var main = document.getElementById('main');
      function render() {
        var s = WT.settings(), tickets = WT.getTickets(), transfers = WT.getTransfers();
        document.getElementById('shell').innerHTML = WT.nav('../../', 'admin', true);
        main.innerHTML = '<p class="eyebrow">Module D · admin control plane</p><h1>Resale & transfer settings</h1><p class="lede">All controls below are stored settings used by the reseller, marketplace, transfer, client-ticket, and gate-scanner flows.</p><section class="card"><div class="card-header"><div><h2>Stored defaults</h2><p>Changes take effect for new listings, transfers, reservations, and QR refreshes.</p></div><span class="badge">Database-backed prototype</span></div><form id="settings-form"><div class="form-grid"><div class="field"><label for="resaleEnabled">Resale marketplace</label><select id="resaleEnabled"><option value="true">Enabled</option><option value="false">Disabled</option></select></div><div class="field"><label for="privateListingsEnabled">Private link listings</label><select id="privateListingsEnabled"><option value="true">Enabled</option><option value="false">Disabled</option></select></div><div class="field"><label for="resellerMarkupCap">Maximum price markup (%)</label><input id="resellerMarkupCap" type="number" min="0" max="100" required><span class="help">Asking price cannot exceed face value plus this percentage.</span></div><div class="field"><label for="listingExpiryDays">Maximum listing duration (days)</label><input id="listingExpiryDays" type="number" min="1" max="90" required></div><div class="field"><label for="transferRevocationHours">Transfer revocation window (hours)</label><input id="transferRevocationHours" type="number" min="0" max="168" required><span class="help">Revocation closes after scan-in regardless of this setting.</span></div><div class="field"><label for="otpExpiryMinutes">OTP expiry (minutes)</label><input id="otpExpiryMinutes" type="number" min="2" max="30" required></div><div class="field"><label for="qrTtlSeconds">Rotating QR TTL (seconds)</label><input id="qrTtlSeconds" type="number" min="10" max="120" required></div><div class="field"><label for="clientLinkExpiryHours">Client link expiry (hours)</label><input id="clientLinkExpiryHours" type="number" min="1" max="168" required></div><div class="field"><label for="offlineScanningEnabled">Offline scanner manifest</label><select id="offlineScanningEnabled"><option value="true">Enabled</option><option value="false">Disabled</option></select></div></div><div class="action-row"><button class="button" type="submit">Save settings</button><button class="button secondary" type="button" id="reset-settings">Restore defaults</button></div></form><div id="settings-status" class="notice" style="display:none"></div></section>' +
          '<section class="card" style="margin-top:18px"><div class="card-header"><div><h2>Ticket enforcement</h2><p>Freeze any ticket or revoke any active transfer before scan-in.</p></div></div><div class="table-wrap"><table><thead><tr><th>Ticket</th><th>Holder</th><th>Status</th><th>Control</th></tr></thead><tbody>' + tickets.map(function (ticket) { return '<tr><td>' + WT.esc(ticket.publicRef) + '<div class="ticket-meta">Section ' + WT.esc(ticket.section) + ' · Row ' + WT.esc(ticket.row) + ' · Seat ' + WT.esc(ticket.seat) + '</div></td><td>' + WT.esc(ticket.holderName || ticket.owner || '—') + '</td><td>' + WT.statusBadge(ticket.frozen ? 'frozen' : ticket.status) + '</td><td><button class="button small ' + (ticket.frozen ? 'secondary' : 'danger') + ' freeze" data-key="' + WT.esc(ticket.key) + '">' + (ticket.frozen ? 'Unfreeze' : 'Freeze ticket') + '</button></td></tr>'; }).join('') + '</tbody></table></div></section>' +
          '<section class="card" style="margin-top:18px"><div class="card-header"><div><h2>Transfer oversight</h2><p>Administrative revocation is recorded with actor and timestamp.</p></div></div><div class="table-wrap"><table><thead><tr><th>Transfer</th><th>Client</th><th>Ticket</th><th>Status</th><th>Control</th></tr></thead><tbody>' + (transfers.length ? transfers.map(function (transfer) { var ticket = WT.getTicket(transfer.ticketKey); return '<tr><td>' + WT.esc(transfer.id) + '<div class="ticket-meta">' + WT.dateTime(transfer.createdAt) + '</div></td><td>' + WT.esc(transfer.clientName) + '<div class="ticket-meta">' + WT.esc(transfer.phone) + '</div></td><td>' + WT.esc(ticket ? ticket.publicRef : '—') + '</td><td>' + WT.statusBadge(transfer.status) + '</td><td>' + (transfer.status === 'active' ? '<button class="button small danger admin-revoke" data-id="' + WT.esc(transfer.id) + '">Revoke</button>' : '—') + '</td></tr>'; }).join('') : '<tr><td colspan="5" class="empty">No transfers.</td></tr>') + '</tbody></table></div></section>' +
          '<section class="card" style="margin-top:18px"><div class="card-header"><div><h2>Immutable audit log</h2><p>Append-only events from listings, transfers, payments, OTP, QR access, and scanning.</p></div></div><div class="audit">' + WT.read(WT.KEYS.audit, []).slice(0, 30).map(function (row) { return '<div class="audit-row"><span>' + WT.dateTime(row.at) + '</span><strong>' + WT.esc(row.action) + '</strong><span>' + WT.esc(row.detail) + ' · ' + WT.esc(row.actor) + '</span></div>'; }).join('') + '</div></section>';
        document.getElementById('resaleEnabled').value = String(s.resaleEnabled); document.getElementById('privateListingsEnabled').value = String(s.privateListingsEnabled); document.getElementById('offlineScanningEnabled').value = String(s.offlineScanningEnabled); ['resellerMarkupCap', 'listingExpiryDays', 'transferRevocationHours', 'otpExpiryMinutes', 'qrTtlSeconds', 'clientLinkExpiryHours'].forEach(function (key) { document.getElementById(key).value = s[key]; }); bind();
      }
      function bind() {
        document.getElementById('settings-form').addEventListener('submit', function (event) { event.preventDefault(); var next = Object.assign({}, WT.settings()); ['resaleEnabled', 'privateListingsEnabled', 'offlineScanningEnabled'].forEach(function (key) { next[key] = document.getElementById(key).value === 'true'; }); ['resellerMarkupCap', 'listingExpiryDays', 'transferRevocationHours', 'otpExpiryMinutes', 'qrTtlSeconds', 'clientLinkExpiryHours'].forEach(function (key) { next[key] = Number(document.getElementById(key).value); }); WT.write(WT.KEYS.settings, next); WT.audit('admin.settings.updated', 'Resale and transfer settings updated'); var status = document.getElementById('settings-status'); status.textContent = 'Settings saved at ' + WT.dateTime(WT.now()) + '.'; status.style.display = 'block'; });
        document.getElementById('reset-settings').addEventListener('click', function () { WT.write(WT.KEYS.settings, WT.DEFAULTS); WT.audit('admin.settings.reset', 'Resale and transfer settings restored to defaults'); WT.toast('Defaults restored.'); render(); });
        document.querySelectorAll('.freeze').forEach(function (button) { button.addEventListener('click', function () { var rows = WT.getTickets(), ticket = rows.filter(function (item) { return item.key === button.dataset.key; })[0]; if (!ticket) return; ticket.frozen = !ticket.frozen; WT.write(WT.KEYS.tickets, rows); WT.audit(ticket.frozen ? 'admin.ticket.frozen' : 'admin.ticket.unfrozen', ticket.publicRef + ' enforcement state changed'); WT.toast(ticket.frozen ? 'Ticket frozen.' : 'Ticket unfrozen.'); render(); }); });
        document.querySelectorAll('.admin-revoke').forEach(function (button) { button.addEventListener('click', function () { var transfers = WT.getTransfers(), transfer = transfers.filter(function (item) { return item.id === button.dataset.id; })[0], tickets = WT.getTickets(), ticket = transfer && tickets.filter(function (item) { return item.key === transfer.ticketKey; })[0]; if (!transfer || transfer.status !== 'active') return; transfer.status = 'revoked'; if (ticket && ticket.status !== 'scanned') ticket.status = 'held'; WT.write(WT.KEYS.transfers, transfers); WT.write(WT.KEYS.tickets, tickets); WT.audit('admin.transfer.revoked', transfer.id + ' revoked by administrator'); WT.toast('Transfer revoked by admin.'); render(); }); });
      }
      if (WT.requireSignedIn('../../')) render();
    }());
  </script>
</body>
</html>
